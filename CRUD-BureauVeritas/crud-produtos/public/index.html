<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CRUD Produtos</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 900px;
                margin: 40px auto;
                padding: 0 20px;
            }
            h1 {
                color: #333;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }
            th,
            td {
                border: 1px solid #ccc;
                padding: 10px;
                text-align: left;
            }
            th {
                background-color: #f0f0f0;
            }
            form {
                margin-top: 20px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                max-width: 400px;
            }
            input {
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            button {
                padding: 8px 16px;
                background: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            button:hover {
                background: #0056b3;
            }
            .btn-delete {
                background: #dc3545;
            }
            .btn-edit {
                background: #ffc107;
                color: black;
            }
        </style>
    </head>
    <body>
        <h1>Cadastro de Produtos</h1>

        <form id="formProduto">
            <input type="hidden" id="produtoId" />
            <input
                type="text"
                id="descricao"
                placeholder="Descrição"
                required
            />
            <input
                type="number"
                id="quantidade"
                placeholder="Quantidade"
                required
            />
            <input
                type="number"
                id="valor"
                placeholder="Valor"
                step="0.01"
                required
            />
            <input type="text" id="usuario" placeholder="Usuário" required />
            <button type="submit">Salvar</button>
            <button type="button" onclick="limparForm()">Cancelar</button>
        </form>

        <table id="tabelaProdutos">
            <thead>
                <tr>
                    <th onclick="ordenar('id')" style="cursor: pointer">
                        ID ↕
                    </th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                    <th onclick="ordenar('valor')" style="cursor: pointer">
                        Valor ↕
                    </th>
                    <th onclick="ordenar('usuario')" style="cursor: pointer">
                        Usuário ↕
                    </th>
                    <th
                        onclick="ordenar('data_cadastro')"
                        style="cursor: pointer"
                    >
                        Data Cadastro ↕
                    </th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>

        <script>
            const API = "http://localhost:3000/produtos";

            let ordenacaoAtual = { campo: "id", direcao: "ASC" };

            function ordenar(campo) {
                if (ordenacaoAtual.campo === campo) {
                    ordenacaoAtual.direcao =
                        ordenacaoAtual.direcao === "ASC" ? "DESC" : "ASC";
                } else {
                    ordenacaoAtual.campo = campo;
                    ordenacaoAtual.direcao = "ASC";
                }
                listar();
            }

            async function listar() {
                const res = await fetch(API);
                let produtos = await res.json();

                produtos.sort((a, b) => {
                    let valA = a[ordenacaoAtual.campo];
                    let valB = b[ordenacaoAtual.campo];
                    if (typeof valA === "string") valA = valA.toLowerCase();
                    if (typeof valB === "string") valB = valB.toLowerCase();
                    if (valA < valB)
                        return ordenacaoAtual.direcao === "ASC" ? -1 : 1;
                    if (valA > valB)
                        return ordenacaoAtual.direcao === "ASC" ? 1 : -1;
                    return 0;
                });

                const tbody = document.getElementById("tbody");
                tbody.innerHTML = "";
                produtos.forEach((p) => {
                    tbody.innerHTML += `
            <tr>
                <td>${p.id}</td>
                <td>${p.descricao}</td>
                <td>${p.quantidade}</td>
                <td>R$ ${parseFloat(p.valor).toFixed(2)}</td>
                <td>${p.usuario}</td>
                <td>${new Date(p.data_cadastro).toLocaleString("pt-BR")}</td>
                <td>
                    <button class="btn-edit" onclick="editar(${p.id}, '${p.descricao}', ${p.quantidade}, ${p.valor}, '${p.usuario}')">Editar</button>
                    <button class="btn-delete" onclick="deletar(${p.id})">Deletar</button>
                </td>
            </tr>`;
                });
            }

            document
                .getElementById("formProduto")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const id = document.getElementById("produtoId").value;
                    const body = {
                        descricao: document.getElementById("descricao").value,
                        quantidade: document.getElementById("quantidade").value,
                        valor: document.getElementById("valor").value,
                        usuario: document.getElementById("usuario").value,
                    };
                    if (id) {
                        await fetch(`${API}/${id}`, {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(body),
                        });
                    } else {
                        await fetch(API, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(body),
                        });
                    }
                    limparForm();
                    listar();
                });

            async function deletar(id) {
                if (confirm("Deletar produto?")) {
                    await fetch(`${API}/${id}`, { method: "DELETE" });
                    listar();
                }
            }

            function editar(id, descricao, quantidade, valor, usuario) {
                document.getElementById("produtoId").value = id;
                document.getElementById("descricao").value = descricao;
                document.getElementById("quantidade").value = quantidade;
                document.getElementById("valor").value = valor;
                document.getElementById("usuario").value = usuario;
            }

            function limparForm() {
                document.getElementById("formProduto").reset();
                document.getElementById("produtoId").value = "";
            }

            listar();
        </script>
    </body>
</html>
